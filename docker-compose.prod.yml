services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fingoat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fingoat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fingoat"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${GHCR_IMAGE_PREFIX}/fingoat-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fingoat:${POSTGRES_PASSWORD}@postgres:5432/fingoat?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8080
    expose:
      - "8080"

  web:
    image: ${GHCR_IMAGE_PREFIX}/fingoat-web:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      ORIGIN: ${ORIGIN}
      PUBLIC_API_URL: http://api:8080
    expose:
      - "3000"

volumes:
  pgdata:
