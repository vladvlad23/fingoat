version: "3.9"
services:
  postgres:
    container_name: fingoat-postgres
    image: postgres:16
    environment:
      POSTGRES_USER: fingoat
      POSTGRES_PASSWORD: fingoat
      POSTGRES_DB: fingoat
    ports:
      - "5432:5432"
    volumes:
      - fingoat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fingoat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fingoat_pgdata:
